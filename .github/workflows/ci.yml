name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and API contract tests
        run: python -m unittest discover -s tests -v

      - name: Compile launch-critical modules
        run: >
          python -m py_compile
          quality.py local_store.py local_api.py recommender.py scraper.py
          backfill_quality.py cleanup_scrape_runs.py worker.py reindex.py
          backfill_embeddings.py embeddings.py mcp_server.py eval_search.py
          launch_check.py
          tests/test_api_contract.py tests/test_quality.py tests/test_quality_routing.py

      - name: Validate docker compose
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config
