name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and API contract tests
        run: python -m unittest discover -s tests -v

      - name: Compile launch-critical modules
        run: >
          python -m py_compile
          quality.py local_store.py local_api.py recommender.py scraper.py
          backfill_quality.py cleanup_scrape_runs.py worker.py reindex.py
          backfill_embeddings.py embeddings.py mcp_server.py eval_search.py
          eval_compare.py launch_check.py pack_content_blobs.py
          tests/test_api_contract.py tests/test_quality.py tests/test_quality_routing.py
          tests/test_content_blobs.py

      - name: Parse PowerShell deploy scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw deploy/backup-local.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw deploy/diagnose-host.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw deploy/restore-local.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw deploy/update-host.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw start_cloudflared.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw start_connector_http.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw start_scraper.ps1)) | Out-Null

      - name: Validate docker compose
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config
